name: Windows native checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/deps/openssl-install
            build/deps/strawberry-perl-5.42.3.1
          key: windows-2022-native-tls-${{ hashFiles('third_party/openssl/provenance.json', 'scripts/build_openssl.py') }}
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal
      - name: Build and run offline checks
        env:
          RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
